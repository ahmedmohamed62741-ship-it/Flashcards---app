<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملخص المحاضرات الذكي 🎓</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js لقراءة ملفات الـ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-4xl mx-auto w-full text-center my-6">
        <div class="inline-flex items-center gap-3 bg-blue-500/10 border border-blue-500/20 px-4 py-2 rounded-full mb-4">
            <i class="fa-solid fa-wand-magic-sparkles text-blue-400"></i>
            <span class="text-xs md:text-sm text-blue-300 font-semibold">مساعد الطلاب الذكي</span>
        </div>
        <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-2">
            تلخيص المحاضرات بضغطة زرار 📚
        </h1>
        <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
            ارفع ملف الـ PDF أو انسخ نص المحاضرة، واحصل على ملخص شامل وأهم الأسئلة المتوقعة في ثوانٍ.
        </p>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto w-full space-y-6">

        <!-- Input Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-7 shadow-xl space-y-5">
            
            <!-- File Upload -->
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">
                    <i class="fa-solid fa-file-pdf text-red-400 ml-1"></i> ارفع ملف المحاضرة (PDF):
                </label>
                <input type="file" id="pdfInput" accept=".pdf" class="block w-full text-sm text-slate-400
                    file:ml-4 file:py-2.5 file:px-5
                    file:rounded-xl file:border-0
                    file:text-sm file:font-bold
                    file:bg-blue-600 file:text-white
                    hover:file:bg-blue-500
                    cursor-pointer bg-slate-950 rounded-xl border border-slate-800 p-2">
            </div>

            <div class="flex items-center my-2 text-slate-600">
                <div class="flex-1 border-t border-slate-800"></div>
                <span class="px-3 text-xs text-slate-500">أو</span>
                <div class="flex-1 border-t border-slate-800"></div>
            </div>

            <!-- Text Input -->
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">
                    <i class="fa-solid fa-align-right text-blue-400 ml-1"></i> انسخ نص المحاضرة هنا:
                </label>
                <textarea id="textInput" rows="6" placeholder="اطبع أو انسخ محتوى المحاضرة هنا..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200 text-sm focus:outline-none focus:border-blue-500 transition resize-y"></textarea>
            </div>

            <!-- Action Button -->
            <button id="summarizeBtn" onclick="processLecture()" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-6 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
                <i class="fa-solid fa-bolt"></i>
                <span>تلخيص المحاضرة الآن</span>
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden text-center py-8 space-y-3">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
            <p class="text-slate-400 text-sm font-semibold animate-pulse">جاري قراءة المحاضرة وتلخيصها بواسطة الذكاء الاصطناعي...</p>
        </div>

        <!-- Output Result -->
        <div id="outputContainer" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h3 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                    <i class="fa-solid fa-circle-check"></i> ملخص المحاضرة
                </h3>
                <button onclick="copyResult()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 px-3 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-copy"></i> نسخ الملخص
                </button>
            </div>
            <div id="outputContent" class="text-slate-300 text-sm md:text-base leading-relaxed whitespace-pre-line"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-slate-600 text-xs my-6">
        تم التطوير لخدمة الطلاب 🚀
    </footer>

    <!-- Logic Script -->
    <script>
        // ==========================================
        // 🔑 حط مفتاح الـ API بتاعك هنا مرة واحدة فقط
        // ==========================================
        const API_KEY = "AQ.Ab8RN6J-1JKMrZUnfu0K-UCPqJQuFk8zKvGinPEMIyfC_alkvg "; 

        // إعداد مكتبة PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        async function processLecture() {
            const textInput = document.getElementById('textInput').value.trim();
            const pdfInput = document.getElementById('pdfInput').files[0];
            const loading = document.getElementById('loading');
            const outputContainer = document.getElementById('outputContainer');
            const outputContent = document.getElementById('outputContent');

            let contentToSummarize = textInput;

            // التحقق من إدخال بيانات
            if (!contentToSummarize && !pdfInput) {
                alert("من فضلك ارفع ملف PDF أو اكتب نص المحاضرة أولاً!");
                return;
            }

            // إظهار تحذير لو المفتاح لسة ما اتحطش في الكود
            if (API_KEY === "ضع_مفتاح_API_الخاص_بك_هنا" || !API_KEY) {
                alert("عفواً! صاحب الموقع لم يقم بإضافة مفتاح التشغيل بعد.");
                return;
            }

            loading.classList.remove('hidden');
            outputContainer.classList.add('hidden');

            try {
                // لو فيه ملف PDF مرفوع، استخرج النص منه
                if (pdfInput) {
                    contentToSummarize = await extractTextFromPDF(pdfInput);
                }

                if (!contentToSummarize.trim()) {
                    throw new Error("لم نتمكن من استخراج أي نص من الملف.");
                }

                // إرسال النص لـ Gemini API
                const summary = await callGeminiAPI(contentToSummarize);
                
                outputContent.innerText = summary;
                outputContainer.classList.remove('hidden');

            } catch (error) {
                alert("حدث خطأ أثناء التلخيص: " + error.message);
            } finally {
                loading.classList.add('hidden');
            }
        }

        // دالة استخراج النص من PDF
        async function extractTextFromPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(" ");
                fullText += pageText + "\n";
            }
            return fullText;
        }

        // دالة الاتصال بـ Gemini API
        async function callGeminiAPI(text) {
            const prompt = `أنت مساعد أكاديمي خبير. قم بتلخيص المحاضرة التالية للطلاب بأسلوب منظم وواضح باللغة العربية:
            1. النقاط الرئيسية والمفاهيم الأساسية.
            2. الشرح المبسط لكل نقطة.
            3. أهم الأسئلة المتوقعة في الامتحانات على هذه المحاضرة.
            
            المحاضرة:
            ${text}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            if (data.error) {
                throw new Error(data.error.message);
            }

            return data.candidates[0].content.parts[0].text;
        }

        // دالة نسخ الملخص
        function copyResult() {
            const text = document.getElementById('outputContent').innerText;
            navigator.clipboard.writeText(text);
            alert("تم نسخ الملخص بنجاح!");
        }
    </script>
</body>
  </html>
