<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو تصميم الملابس - CanvaEgy Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fabric.js Canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@500;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .canvas-container { margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white">
                <i class="fa-solid me-1 fa-shirt text-xl"></i>
            </div>
            <h1 class="text-xl font-black tracking-wide text-indigo-400">CanvaEgy <span class="text-white text-sm font-normal">| مصنع التصاميم الفوري</span></h1>
        </div>
        <div class="flex gap-2">
            <button onclick="exportPNG()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded-lg text-sm flex items-center gap-2 transition">
                <i class="fa-solid fa-download"></i> تنزيل طباعة (PNG شفاف)
            </button>
            <button onclick="exportMockup()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg text-sm flex items-center gap-2 transition">
                <i class="fa-solid fa-image"></i> تنزيل الموك آب
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col lg:flex-row p-4 gap-4 max-w-7xl mx-auto w-full">

        <!-- Left Controls Panel -->
        <div class="w-full lg:w-1/3 bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-5 overflow-y-auto max-h-[85vh]">
            
            <!-- Quick Generators Section -->
            <div>
                <h2 class="text-md font-bold text-indigo-300 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> توليد سريع بضغطة زر
                </h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="generateStreetwear()" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white p-3 rounded-lg text-xs font-bold flex flex-col items-center gap-2 transition">
                        <i class="fa-solid fa-fire text-orange-500 text-lg"></i>
                        تصميم Streetwear
                    </button>
                    <button onclick="generateGym()" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white p-3 rounded-lg text-xs font-bold flex flex-col items-center gap-2 transition">
                        <i class="fa-solid fa-dumbbell text-emerald-400 text-lg"></i>
                        تصميم للجيم
                    </button>
                    <button onclick="generateArabicQuote()" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white p-3 rounded-lg text-xs font-bold flex flex-col items-center gap-2 transition">
                        <i class="fa-solid fa-quote-right text-cyan-400 text-lg"></i>
                        عبارة عربية تريند
                    </button>
                    <button onclick="generateRandomDesign()" class="bg-indigo-700 hover:bg-indigo-600 text-white p-3 rounded-lg text-xs font-bold flex flex-col items-center gap-2 transition col-span-2">
                        <i class="fa-solid fa-dice text-yellow-300 text-lg"></i>
                        🎲 فاجئني بتصميم عشوائي
                    </button>
                </div>
            </div>

            <hr class="border-slate-700">

            <!-- Customization Controls -->
            <div class="space-y-4">
                <h2 class="text-md font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-indigo-400"></i> التحكم والتعديل اليدوي
                </h2>

                <!-- Add Text -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">إضافة نص مخصص:</label>
                    <div class="flex gap-2">
                        <input type="text" id="customTextInput" placeholder="اكتب الكلمة هنا..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <button onclick="addCustomText()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-bold">إضافة</button>
                    </div>
                </div>

                <!-- Font Selection -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">نوع الخط العربي:</label>
                    <select id="fontSelect" onchange="changeFont()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none">
                        <option value="Cairo">القاهرة (Cairo)</option>
                        <option value="Tajawal">تجوال (Tajawal)</option>
                        <option value="Amiri">الأميري (Amiri)</option>
                    </select>
                </div>

                <!-- Garment Color Picker -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">لون القماش (التيشرت):</label>
                    <div class="flex gap-2">
                        <button onclick="setGarmentColor('#111827')" class="w-8 h-8 rounded-full bg-gray-900 border-2 border-white"></button>
                        <button onclick="setGarmentColor('#ffffff')" class="w-8 h-8 rounded-full bg-white border-2 border-gray-400"></button>
                        <button onclick="setGarmentColor('#991b1b')" class="w-8 h-8 rounded-full bg-red-800 border-2 border-white"></button>
                        <button onclick="setGarmentColor('#1e3a8a')" class="w-8 h-8 rounded-full bg-blue-900 border-2 border-white"></button>
                        <button onclick="setGarmentColor('#065f46')" class="w-8 h-8 rounded-full bg-emerald-800 border-2 border-white"></button>
                    </div>
                </div>

                <!-- Delete Selected Object -->
                <button onclick="deleteSelected()" class="w-full bg-red-900/40 hover:bg-red-800/60 border border-red-700/50 text-red-300 py-2 rounded-lg text-sm font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trash"></i> حذف العنصر المحدد
                </button>
            </div>
        </div>

        <!-- Right Canvas Preview -->
        <div class="flex-1 bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col items-center justify-center relative min-h-[500px]">
            <div id="canvasWrapper" class="relative">
                <canvas id="tshirtCanvas" width="380" height="480"></canvas>
            </div>
            <p class="text-xs text-slate-400 mt-4"><i class="fa-solid fa-circle-info me-1"></i> يمكنك تحريك النصوص، تكبيرها، تدويرها، أو الضغط عليها للتعديل المباشر.</p>
        </div>

    </div>

    <!-- Script Implementation -->
    <script>
        let canvas;
        let garmentColor = '#111827';

        // Initialize Canvas
        window.onload = function() {
            canvas = new fabric.Canvas('tshirtCanvas', {
                backgroundColor: garmentColor,
                selection: true
            });
            drawGarmentOutline();
            generateStreetwear(); // Initial design load
        };

        // Draw T-Shirt Outline Frame
        function drawGarmentOutline() {
            canvas.backgroundColor = garmentColor;
            canvas.renderAll();
        }

        // Change Garment Color
        function setGarmentColor(color) {
            garmentColor = color;
            canvas.backgroundColor = color;
            canvas.renderAll();
        }

        // Add Custom Text
        function addCustomText() {
            const input = document.getElementById('customTextInput');
            if(!input.value.trim()) return;

            const text = new fabric.Text(input.value, {
                left: 190,
                top: 240,
                originX: 'center',
                originY: 'center',
                fill: '#ffffff',
                fontSize: 32,
                fontFamily: document.getElementById('fontSelect').value,
                fontWeight: 'bold',
                cornerColor: '#6366f1'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
            input.value = '';
            canvas.renderAll();
        }

        // Change Selected Text Font
        function changeFont() {
            const activeObj = canvas.getActiveObject();
            if(activeObj && activeObj.type === 'text') {
                activeObj.set('fontFamily', document.getElementById('fontSelect').value);
                canvas.renderAll();
            }
        }

        // Delete Selected Item
        function deleteSelected() {
            const activeObj = canvas.getActiveObject();
            if(activeObj) {
                canvas.remove(activeObj);
                canvas.renderAll();
            }
        }

        // --- Instant Generators --- //

        function clearCanvas() {
            canvas.clear();
            drawGarmentOutline();
        }

        function generateStreetwear() {
            clearCanvas();
            setGarmentColor('#111827');

            const title = new fabric.Text("LIMITED EDITION", {
                left: 190, top: 140, originX: 'center', fill: '#f59e0b', fontSize: 18, fontFamily: 'Cairo', fontWeight: '900', letterSpacing: 2
            });
            const mainText = new fabric.Text("لا تستسلم", {
                left: 190, top: 210, originX: 'center', fill: '#ffffff', fontSize: 52, fontFamily: 'Tajawal', fontWeight: '800'
            });
            const subText = new fabric.Text("URBAN STREETWEAR 2026", {
                left: 190, top: 290, originX: 'center', fill: '#9ca3af', fontSize: 12, fontFamily: 'Cairo'
            });

            canvas.add(title, mainText, subText);
            canvas.renderAll();
        }

        function generateGym() {
            clearCanvas();
            setGarmentColor('#0f172a');

            const iconText = new fabric.Text("💪", { left: 190, top: 130, originX: 'center', fontSize: 50 });
            const mainText = new fabric.Text("NO PAIN NO GAIN", {
                left: 190, top: 210, originX: 'center', fill: '#10b981', fontSize: 30, fontFamily: 'Cairo', fontWeight: '900'
            });
            const subText = new fabric.Text("عافية ووحوش", {
                left: 190, top: 270, originX: 'center', fill: '#ffffff', fontSize: 36, fontFamily: 'Tajawal', fontWeight: 'bold'
            });

            canvas.add(iconText, mainText, subText);
            canvas.renderAll();
        }

        function generateArabicQuote() {
            clearCanvas();
            setGarmentColor('#1e3a8a');

            const mainText = new fabric.Text("صُنع بشغف", {
                left: 190, top: 200, originX: 'center', fill: '#facc15', fontSize: 46, fontFamily: 'Amiri', fontWeight: 'bold'
            });
            const subText = new fabric.Text("EGYPTIAN BRAND", {
                left: 190, top: 270, originX: 'center', fill: '#ffffff', fontSize: 14, fontFamily: 'Cairo', letterSpacing: 4
            });

            canvas.add(mainText, subText);
            canvas.renderAll();
        }

        function generateRandomDesign() {
            const generators = [generateStreetwear, generateGym, generateArabicQuote];
            const randomIndex = Math.floor(Math.random() * generators.length);
            generators[randomIndex]();
        }

        // Export Transparent PNG
        function exportPNG() {
            canvas.discardActiveObject();
            const originalBg = canvas.backgroundColor;
            canvas.backgroundColor = null; // Set transparent
            canvas.renderAll();

            const dataURL = canvas.toDataURL({ format: 'png', multiplier: 2 });
            
            canvas.backgroundColor = originalBg;
            canvas.renderAll();

            const link = document.createElement('a');
            link.download = 'design-print-transparent.png';
            link.href = dataURL;
            link.click();
        }

        // Export Full Mockup
        function exportMockup() {
            canvas.discardActiveObject();
            canvas.renderAll();

            const dataURL = canvas.toDataURL({ format: 'jpeg', quality: 0.9, multiplier: 2 });
            const link = document.createElement('a');
            link.download = 'tshirt-mockup.jpg';
            link.href = dataURL;
            link.click();
        }
    </script>
</body>
    </html>
