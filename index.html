<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملخص المحاضرات الأكاديمي الشامل 🎓</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        
        #outputContent h2 { 
            font-size: 1.3rem; 
            font-weight: 800; 
            color: #38bdf8; 
            border-right: 4px solid #0284c7; 
            padding-right: 0.75rem; 
            margin-top: 1.75rem; 
            margin-bottom: 1rem; 
        }
        #outputContent h3 { 
            font-size: 1.15rem; 
            font-weight: 700; 
            color: #34d399; 
            margin-top: 1.25rem; 
            margin-bottom: 0.5rem; 
        }
        #outputContent ul { 
            list-style-type: disc; 
            padding-right: 1.5rem; 
            margin-bottom: 1rem; 
        }
        #outputContent ol { 
            list-style-type: decimal; 
            padding-right: 1.5rem; 
            margin-bottom: 1rem; 
        }
        #outputContent li { 
            margin-bottom: 0.5rem; 
            line-height: 1.8;
        }
        #outputContent p { 
            margin-bottom: 0.85rem; 
            line-height: 1.8;
        }
        #outputContent strong { 
            color: #facc15; 
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

    <header class="max-w-4xl mx-auto w-full text-center my-6">
        <div class="inline-flex items-center gap-3 bg-blue-500/10 border border-blue-500/20 px-4 py-2 rounded-full mb-4">
            <i class="fa-solid fa-graduation-cap text-blue-400"></i>
            <span class="text-xs md:text-sm text-blue-300 font-semibold">المساعد الأكاديمي الشامل للمحاضرات</span>
        </div>
        <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-2">
            تلخيص المحاضرات والملفات بضغطة زرار 📚
        </h1>
        <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
            تحليل دقيق وكامل للسلايدز والملفات المكتوبة أو المصورة دون إغفال التفاصيل الهامة.
        </p>
    </header>

    <main class="max-w-4xl mx-auto w-full space-y-6">

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-7 shadow-xl space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">
                    <i class="fa-solid fa-file-pdf text-emerald-400 ml-1"></i> ارفع ملف المحاضرة (PDF أو صورة):
                </label>
                <input type="file" id="fileInput" accept=".pdf, image/png, image/jpeg, image/jpg, image/webp" class="block w-full text-sm text-slate-400
                    file:ml-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0
                    file:text-sm file:font-bold file:bg-blue-600 file:text-white
                    hover:file:bg-blue-500 cursor-pointer bg-slate-950 rounded-xl border border-slate-800 p-2">
            </div>

            <div class="flex items-center my-2 text-slate-600">
                <div class="flex-1 border-t border-slate-800"></div>
                <span class="px-3 text-xs text-slate-500">أو</span>
                <div class="flex-1 border-t border-slate-800"></div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">
                    <i class="fa-solid fa-align-right text-blue-400 ml-1"></i> انسخ نص المحاضرة هنا:
                </label>
                <textarea id="textInput" rows="5" placeholder="اطبع أو انسخ محتوى المحاضرة هنا..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200 text-sm focus:outline-none focus:border-blue-500 transition resize-y"></textarea>
            </div>

            <button id="summarizeBtn" onclick="processLecture()" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-6 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
                <i class="fa-solid fa-bolt"></i>
                <span>بدء التلخيص الشامل والعميق</span>
            </button>
        </div>

        <div id="loading" class="hidden text-center py-8 space-y-3">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
            <p id="loadingText" class="text-slate-400 text-sm font-semibold animate-pulse">جاري تحويل السلايدز وتحليلها بصرياً...</p>
        </div>

        <div id="outputContainer" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h3 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                    <i class="fa-solid fa-circle-check"></i> التلخيص الأكاديمي الشامل
                </h3>
                <button onclick="copyResult()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 px-3 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-copy"></i> نسخ الملخص
                </button>
            </div>
            <div id="outputContent" class="text-slate-300 text-sm md:text-base"></div>
        </div>

    </main>

    <footer class="text-center text-slate-600 text-xs my-6">
        تم التطوير لخدمة الطلاب 🚀
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const ENCODED_KEY = "QUl6YVN5RFlDVkN5N1NWM2NlNjBaTHBJdGQwdG1xREtqUUY3aHRj";

        async function processLecture() {
            const textInput = document.getElementById('textInput').value.trim();
            const uploadedFile = document.getElementById('fileInput').files[0];
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');
            const outputContainer = document.getElementById('outputContainer');
            const outputContent = document.getElementById('outputContent');

            if (!textInput && !uploadedFile) {
                alert("من فضلك ارفع ملف PDF، صورة، أو اكتب نص المحاضرة أولاً!");
                return;
            }

            loading.classList.remove('hidden');
            outputContainer.classList.add('hidden');

            try {
                const API_KEY = atob(ENCODED_KEY);
                let parts = [];
                
                const systemPrompt = `You are an elite professor and academic summary expert. 
Analyze the provided lecture pages (text or slide images) deeply and comprehensively.
Produce an EXHAUSTIVE, DETAILED academic summary that covers EVERY topic, definition, formula, drug name, mechanism, diagram concept, and clinical note so students can pass their exams with top marks.

STRICT RULES:
1. NEVER complain about missing text or output boilerplate responses if images/pages are provided. Read the text directly from the slide images!
2. Write the summary in the primary language of the lecture (Arabic if Arabic, English if English).
3. Organize with clear headers, bullet points, and bold key terms.

REQUIRED SECTIONS:
## 📌 1. Comprehensive Overview & Main Concepts
* Key scope and core principles...

## 🔬 2. Deep Academic Breakdown & Detailed Mechanics
* Detailed explanation covering all slides thoroughly...

## 💊 3. Key Formulas, Treatments, or Clinical Applications (If applicable)
* Practical applications, treatments, or specific details...

## 🎯 4. Essential High-Yield Exam Questions & Answers
* Exam-style questions and answers derived from the material...`;

                parts.push({ text: systemPrompt });

                if (uploadedFile) {
                    if (uploadedFile.type === 'application/pdf' || uploadedFile.name.endsWith('.pdf')) {
                        loadingText.innerText = "جاري قراءة محتوى صفحات الـ PDF...";
                        const arrayBuffer = await uploadedFile.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        
                        let extractedText = "";
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(" ");
                            extractedText += `\n--- Page ${i} ---\n` + pageText;
                        }

                        // حساب متوسط الحروف في الصفحة لمعرفة هل الملف نصي حقيقي أم سلايدز/صور
                        const cleanText = extractedText.replace(/--- Page \d+ ---/g, '').trim();
                        const avgCharsPerPage = cleanText.length / pdf.numPages;

                        // لو الصفحة فيها أقل من 150 حرف في المتوسط، ده أكيد سلايدز أو ملف مصور!
                        if (avgCharsPerPage > 150 && cleanText.length > 1000) {
                            parts.push({ text: "Full Lecture Content:\n" + extractedText });
                        } else {
                            loadingText.innerText = `الملف عبارة عن سلايدز/صور (${pdf.numPages} صفحة)، جاري تحويلها لصور عالية الدقة وقراءتها بصرياً...`;
                            const imageParts = await renderPdfPagesToImages(pdf);
                            parts = parts.concat(imageParts);
                        }

                    } else {
                        loadingText.innerText = "جاري قراءة الصورة...";
                        const base64Data = await fileToBase64(uploadedFile);
                        parts.push({
                            inlineData: { mimeType: uploadedFile.type || 'image/jpeg', data: base64Data }
                        });
                    }
                }

                if (textInput) {
                    parts.push({ text: "Additional Text:\n" + textInput });
                }

                loadingText.innerText = "جاري توليد التلخيص الأكاديمي الشامل بواسطة الذكاء الاصطناعي...";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const rawMarkdown = data.candidates[0].content.parts[0].text;
                outputContent.innerHTML = marked.parse(rawMarkdown);
                outputContainer.classList.remove('hidden');

            } catch (error) {
                alert("حدث خطأ أثناء التلخيص: " + error.message);
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function renderPdfPagesToImages(pdf) {
            let imageParts = [];
            const totalPages = Math.min(pdf.numPages, 40);

            for (let i = 1; i <= totalPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                
                const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                imageParts.push({
                    inlineData: {
                        mimeType: 'image/jpeg',
                        data: base64Image
                    }
                });
            }
            return imageParts;
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function copyResult() {
            const text = document.getElementById('outputContent').innerText;
            navigator.clipboard.writeText(text);
            alert("تم نسخ الملخص بنجاح!");
        }
    </script>
</body>
    </html>
