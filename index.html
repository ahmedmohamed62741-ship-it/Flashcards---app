<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفرغ الريكوردات والمحاضرات الذكي AI 🎙️⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #030712; color: #f8fafc; }
        
        .neon-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.25);
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.15);
            transition: all 0.3s ease;
        }
        .glow-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
            transition: all 0.2s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.6);
            transform: scale(1.01);
        }

        #outputContent h2 { font-size: 1.3rem; font-weight: 800; color: #38bdf8; border-right: 4px solid #0284c7; padding-right: 0.75rem; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        #outputContent h3 { font-size: 1.15rem; font-weight: 700; color: #34d399; margin-top: 1.25rem; margin-bottom: 0.5rem; background: #1e293b; padding: 0.6rem 0.8rem; border-radius: 0.5rem; border: 1px solid #334155; }
        #outputContent ul { list-style-type: disc; padding-right: 1.5rem; margin-bottom: 1rem; }
        #outputContent li { margin-bottom: 0.4rem; line-height: 1.8; color: #cbd5e1; }
        #outputContent strong { color: #facc15; font-weight: 700; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <header class="max-w-4xl mx-auto w-full text-center my-6">
        <div class="inline-block p-3 rounded-2xl bg-purple-900/30 border border-purple-500/30 text-purple-400 mb-3 animate-pulse">
            <i class="fa-solid fa-microphone-lines text-3xl"></i>
        </div>
        <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 tracking-tight mb-3">
            مفرغ الريكوردات والمحاضرات الذكي AI 🎙️⚡
        </h1>
        <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
            يقسم الريكوردات الطويلة تلقائياً ويعرض لك التفريغ أولاً بأول في الشاشة أثناء التحميل بأقصى سرعة.
        </p>
    </header>

    <main class="max-w-4xl mx-auto w-full space-y-6">

        <div class="neon-card rounded-2xl p-5 md:p-8 space-y-6">
            
            <!-- API Key Input -->
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 space-y-2">
                <label for="apiKeyInput" class="block text-xs font-bold text-slate-300 flex items-center justify-between">
                    <span>🔑 مفاتيح API (مفصولة بفاصلة ,):</span>
                    <span class="text-[10px] text-cyan-400 font-normal">يُحفظ تلقائياً في متصفحك</span>
                </label>
                <input type="text" id="apiKeyInput" oninput="saveApiKey()" placeholder="أدخل المفتاح الأول، أو عدة مفاتيح مفصولة بـ ," class="w-full bg-slate-950 border border-slate-700 rounded-lg py-2.5 px-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono tracking-wider">
            </div>

            <!-- Audio Recording Upload Section -->
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                <label class="block text-xs font-bold text-slate-300 flex items-center justify-between">
                    <span>🎙️ رفع الريكورد الصوتي (يُقسم ويُفرغ في الشاشة أولاً بأول):</span>
                    <span id="audioStatus" class="text-[10px] text-slate-400 font-normal">لم يتم اختيار ملف</span>
                </label>
                <div class="flex items-center gap-3">
                    <label class="flex-1 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl p-3 text-center cursor-pointer transition flex items-center justify-center gap-2 text-xs md:text-sm text-slate-200">
                        <i class="fa-solid fa-file-audio text-cyan-400 text-lg"></i>
                        <span id="audioFileName">اختر ملف الصوت (MP3, WAV, M4A...)</span>
                        <input type="file" id="audioInput" accept="audio/*" onchange="handleAudioSelect(event)" class="hidden">
                    </label>
                    <button type="button" onclick="clearAudio()" class="bg-red-900/30 hover:bg-red-900/50 text-red-400 p-3 rounded-xl border border-red-500/30 text-xs transition" title="إزالة الريكورد">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </div>

            <!-- Lecture Context / Text Input -->
            <div class="space-y-2">
                <label for="topicInput" class="block text-xs font-bold text-slate-300">
                    📚 محتوى المحاضرة المكتوب أو ملاحظات لتوضيح سياق الريكورد (يُحفظ تلقائياً):
                </label>
                <textarea id="topicInput" rows="5" oninput="saveTopicInput()" placeholder="الصق هنا نص أو تفاصيل المحاضرة التي يشرحها الدكتور، ليفهم الريكورد بناءً عليها بدقة..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs md:text-sm text-slate-200 focus:outline-none focus:border-purple-500 leading-relaxed"></textarea>
            </div>

            <button id="processBtn" onclick="transcribeAudioAndLecture()" class="w-full glow-btn text-white font-bold py-4 px-6 rounded-xl text-sm flex items-center justify-center gap-2 cursor-pointer select-none">
                <i class="fa-solid fa-bolt text-lg"></i>
                <span>بدء التففريغ السريع والكتابة الفورية في الشاشة ⚡</span>
            </button>
        </div>

        <!-- Loading Indicator with Cancel Button -->
        <div id="loading" class="hidden text-center py-6 space-y-4">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-cyan-500 border-t-transparent shadow-lg shadow-cyan-500/50"></div>
            <p id="loadingText" class="text-cyan-400 text-xs font-bold animate-pulse">جاري تجهيز الصوت وتقسيمه للتفريغ السريع...</p>
            <div>
                <button onclick="cancelTranscription()" class="text-xs bg-red-900/50 hover:bg-red-900 text-red-200 py-1.5 px-4 rounded-lg border border-red-500/40 transition cursor-pointer">
                    <i class="fa-solid fa-stop text-red-400 mr-1"></i> إيقاف واستكمال ما تم تفريغه
                </button>
            </div>
        </div>

        <!-- Output Result Section (يظهر فوراً مع أول جزء) -->
        <div id="outputContainer" class="hidden neon-card rounded-2xl p-6 md:p-8 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h3 class="text-base font-bold text-cyan-400 flex items-center gap-2 m-0 bg-transparent p-0 border-0">
                    <i class="fa-solid fa-file-lines text-xl"></i> تفريغ المحاضرة والريكورد (يتحدث تلقائياً)
                </h3>
                <button onclick="downloadPDF()" class="text-xs bg-red-900/40 hover:bg-red-900/60 active:scale-95 text-red-200 py-2 px-4 rounded-xl border border-red-500/30 transition flex items-center gap-1.5 cursor-pointer select-none shadow-md">
                    <i class="fa-solid fa-file-pdf text-red-400"></i> تحميل كملف PDF 📄
                </button>
            </div>
            <div id="outputContent" class="text-slate-300 text-xs md:text-sm leading-relaxed space-y-4"></div>
        </div>

    </main>

    <footer class="text-center text-slate-500 text-xs my-8">
        مفرغ الريكوردات والمحاضرات الذكي مدعوم بالذكاء الاصطناعي 🎙️⚡
    </footer>

    <script>
        const MODELS = [
            "gemini-3.8-flash",
            "gemini-3.6-flash"
        ];

        let selectedAudioFile = null;
        let isCancelled = false;
        let currentAbortController = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('user_gemini_api_keys');
            if (savedKey && savedKey.trim() !== "") {
                document.getElementById('apiKeyInput').value = savedKey;
            }

            const savedTopic = localStorage.getItem('saved_topic_input');
            if (savedTopic) {
                document.getElementById('topicInput').value = savedTopic;
            }

            const savedTranscription = localStorage.getItem('last_saved_transcription_markdown');
            if (savedTranscription && savedTranscription.trim() !== "") {
                const outputContent = document.getElementById('outputContent');
                const outputContainer = document.getElementById('outputContainer');
                outputContent.innerHTML = window.marked ? marked.parse(savedTranscription) : savedTranscription;
                outputContainer.classList.remove('hidden');
            }
        });

        function saveApiKey() {
            const keyInput = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('user_gemini_api_keys', keyInput);
        }

        function saveTopicInput() {
            const topicText = document.getElementById('topicInput').value;
            localStorage.setItem('saved_topic_input', topicText);
        }

        function handleAudioSelect(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            selectedAudioFile = file;
            const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
            document.getElementById('audioFileName').innerText = `${file.name} (${sizeMB} MB)`;
            document.getElementById('audioStatus').innerText = "تم إرفاق الريكورد بنجاح 🎙️";
            document.getElementById('audioStatus').className = "text-[10px] text-emerald-400 font-bold";
        }

        function clearAudio() {
            selectedAudioFile = null;
            document.getElementById('audioInput').value = "";
            document.getElementById('audioFileName').innerText = "اختر ملف الصوت (MP3, WAV, M4A...)";
            document.getElementById('audioStatus').innerText = "لم يتم اختيار ملف";
            document.getElementById('audioStatus').className = "text-[10px] text-slate-400 font-normal";
        }

        function cancelTranscription() {
            isCancelled = true;
            if (currentAbortController) {
                currentAbortController.abort();
            }
            document.getElementById('loading').classList.add('hidden');
            const btn = document.getElementById('processBtn');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // تقسيم وضغط الصوت إلى مقاطع صغيرة (10 دقائق لكل مقطع بتردد 8000Hz خفيف وسريع جداً)
        async function splitAndCompressAudio(file) {
            const loadingText = document.getElementById('loadingText');
            loadingText.innerText = "جاري معالجة وتقسيم الصوت إلى مقاطع فائقة السرعة... ⚡";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                const totalDuration = audioBuffer.duration;
                const chunkDuration = 600; // 10 دقائق (600 ثانية) لكل جزء لتسريع الرفع والرد الفوري
                const targetSampleRate = 8000; // 8kHz كافية تماماً للكلام وتجعل حجم الملف صغيراً جداً
                const chunks = [];

                for (let start = 0; start < totalDuration; start += chunkDuration) {
                    const duration = Math.min(chunkDuration, totalDuration - start);
                    const offlineCtx = new OfflineAudioContext(1, Math.ceil(duration * targetSampleRate), targetSampleRate);

                    const source = offlineCtx.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(offlineCtx.destination);
                    source.start(0, start, duration);

                    const renderedBuffer = await offlineCtx.startRendering();
                    const wavBlob = audioBufferToWav(renderedBuffer);
                    const base64Data = await blobToBase64(wavBlob);

                    const startMin = Math.floor(start / 60);
                    const endMin = Math.ceil((start + duration) / 60);
                    chunks.push({
                        data: base64Data,
                        mimeType: "audio/wav",
                        label: `من الدقيقة ${startMin} إلى الدقيقة ${endMin}`
                    });
                }

                return chunks;
            } catch (e) {
                // إذا تعذر فك الضغط في المتصفح، يتم إرساله كجزء واحد
                const base64Data = await blobToBase64(file);
                return [{
                    data: base64Data,
                    mimeType: file.type || "audio/mp3",
                    label: "التسجيل الكامل"
                }];
            }
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        function audioBufferToWav(buffer) {
            const numOfChan = 1;
            const length = buffer.length * numOfChan * 2 + 44;
            const out = new ArrayBuffer(length);
            const view = new DataView(out);
            const sampleRate = buffer.sampleRate;
            let offset = 0;

            function writeString(str) {
                for (let i = 0; i < str.length; i++) {
                    view.setUint8(offset + i, str.charCodeAt(i));
                }
                offset += str.length;
            }

            writeString('RIFF');
            view.setUint32(offset, length - 8, true); offset += 4;
            writeString('WAVE');
            writeString('fmt ');
            view.setUint32(offset, 16, true); offset += 4;
            view.setUint16(offset, 1, true); offset += 2;
            view.setUint16(offset, numOfChan, true); offset += 2;
            view.setUint32(offset, sampleRate, true); offset += 4;
            view.setUint32(offset, sampleRate * 2, true); offset += 4;
            view.setUint16(offset, 2, true); offset += 2;
            view.setUint16(offset, 16, true); offset += 2;
            writeString('data');
            view.setUint32(offset, length - offset - 4, true); offset += 4;

            const channelData = buffer.getChannelData(0);
            for (let i = 0; i < channelData.length; i++) {
                let s = Math.max(-1, Math.min(1, channelData[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                offset += 2;
            }

            return new Blob([out], { type: 'audio/wav' });
        }

        async function fetchWithKeyRotation(requestData, statusMessage) {
            const rawKeyInput = document.getElementById('apiKeyInput').value.trim();
            if (!rawKeyInput) {
                throw new Error("برجاء أدخل مفتاح API في الخانة المخصصة بالأعلى أولاً!");
            }

            const keys = rawKeyInput.split(',').map(k => k.trim()).filter(k => k);
            const loadingText = document.getElementById('loadingText');
            let lastError = null;

            for (const modelName of MODELS) {
                for (let i = 0; i < keys.length; i++) {
                    if (isCancelled) throw new Error("CANCELLED");
                    const currentKey = keys[i];

                    for (let attempt = 1; attempt <= 2; attempt++) {
                        try {
                            loadingText.innerText = `${statusMessage} (${modelName})... ⚡`;
                            
                            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${currentKey}`;
                            
                            currentAbortController = new AbortController();
                            const timeoutId = setTimeout(() => currentAbortController.abort(), 300000); // 5 دقائق كحد أقصى للجزء الواحد

                            const res = await fetch(endpoint, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(requestData),
                                signal: currentAbortController.signal
                            });

                            clearTimeout(timeoutId);

                            if (res.status === 429 || res.status === 503) {
                                await new Promise(r => setTimeout(r, 1500));
                                continue;
                            }

                            const data = await res.json();
                            if (res.ok && data.candidates && data.candidates[0]) {
                                return data.candidates[0].content.parts[0].text;
                            } else if (data.error) {
                                lastError = new Error(data.error.message);
                                if (res.status === 404 || (data.error.message && data.error.message.includes('is no longer available'))) {
                                    break;
                                }
                            }
                        } catch (err) {
                            if (err.name === 'AbortError' || isCancelled) {
                                throw new Error("CANCELLED");
                            }
                            lastError = err;
                        }
                    }
                }
            }
            throw lastError || new Error("فشل الاتصال بالموديلات والمفاتيح المدخلة.");
        }

        async function transcribeAudioAndLecture() {
            try {
                const topic = document.getElementById('topicInput').value.trim();

                if (!topic && !selectedAudioFile) {
                    alert("برجاء رفع تسجيل صوتي للريكورد أو إدخال نص المحاضرة على الأقل!");
                    return;
                }

                isCancelled = false;
                const processBtn = document.getElementById('processBtn');
                const loading = document.getElementById('loading');
                const outputContainer = document.getElementById('outputContainer');
                const outputContent = document.getElementById('outputContent');

                processBtn.disabled = true;
                processBtn.classList.add('opacity-50', 'cursor-not-allowed');
                loading.classList.remove('hidden');

                const systemPrompt = `You are an elite Academic, Medical Professor, and Expert Transcriptionist.
Your task is to listen to the provided audio segment and read the accompanying lecture text/notes.
Produce a thorough, detailed, and beautifully structured markdown transcription of everything the speaker/doctor said without dropping any detail.

CRITICAL INSTRUCTIONS:
1. ABSOLUTE COMPLETENESS: Transcribe and cover every single topic, explanation, and detail mentioned in this audio segment.
2. LANGUAGE & TERMINOLOGY FIDELITY: Seamlessly handle both Arabic explanation and English scientific/medical terms in the exact same transcription as spoken. Use Google Search grounding to verify and spell all medical, technical, and scientific names perfectly.
3. FORMATTING: Use clear Markdown headings (##), subheadings (###), bullet points, and bold text for key terms.
4. NO FILLER: Output strictly the formatted markdown content directly without conversational preamble.`;

                let accumulatedMarkdown = "";

                if (selectedAudioFile) {
                    const audioChunks = await splitAndCompressAudio(selectedAudioFile);
                    outputContainer.classList.remove('hidden');
                    outputContent.innerHTML = `<p class="text-cyan-400 animate-pulse">تم تقسيم الريكورد إلى ${audioChunks.length} أجزاء سريعة، سيظهر التفريغ هنا تباعاً...</p>`;

                    for (let idx = 0; idx < audioChunks.length; idx++) {
                        if (isCancelled) break;

                        const chunk = audioChunks[idx];
                        const statusMsg = `جاري تفريغ الجزء ${idx + 1} من ${audioChunks.length} (${chunk.label})`;

                        const requestData = {
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            contents: [{
                                parts: [
                                    {
                                        inlineData: {
                                            mimeType: chunk.mimeType,
                                            data: chunk.data
                                        }
                                    },
                                    {
                                        text: `هذا هو الجزء رقم (${idx + 1} من ${audioChunks.length}) [${chunk.label}].\nمحتوى المحاضرة أو السياق المرفق:\n${topic || "لا يوجد نص مرفق، فرّغ الصوت بدقة مع دمج العربي والإنجليزي وتدقيق المصطلحات عبر جوجل."}`
                                    }
                                ]
                            }],
                            tools: [{ googleSearch: {} }],
                            generationConfig: { 
                                temperature: 0.1, 
                                maxOutputTokens: 8192
                            }
                        };

                        const chunkMarkdown = await fetchWithKeyRotation(requestData, statusMsg);
                        
                        // إضافة الجزء المفرغ فوراً إلى الشاشة وحفظه في المتصفح أثناء تحميل باقي الأجزاء
                        const sectionHeader = audioChunks.length > 1 ? `\n\n---\n## ⏱️ الجزء ${idx + 1} (${chunk.label})\n\n` : "";
                        accumulatedMarkdown += sectionHeader + chunkMarkdown;

                        localStorage.setItem('last_saved_transcription_markdown', accumulatedMarkdown);
                        outputContent.innerHTML = window.marked ? marked.parse(accumulatedMarkdown) : accumulatedMarkdown;
                    }
                } else {
                    // في حالة إدخال نص المحاضرة فقط بدون ملف صوتي
                    const requestData = {
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        contents: [{
                            parts: [{ text: `قم بتنظيم وتلخيص وشرح محتوى المحاضرة التالي بدقة:\n${topic}` }]
                        }],
                        tools: [{ googleSearch: {} }],
                        generationConfig: { temperature: 0.1, maxOutputTokens: 8192 }
                    };

                    accumulatedMarkdown = await fetchWithKeyRotation(requestData, "جاري تنظيم وشرح المحاضرة");
                    localStorage.setItem('last_saved_transcription_markdown', accumulatedMarkdown);
                    outputContent.innerHTML = window.marked ? marked.parse(accumulatedMarkdown) : accumulatedMarkdown;
                    outputContainer.classList.remove('hidden');
                }

            } catch (err) {
                if (err.message !== "CANCELLED") {
                    alert("حدث خطأ أثناء التفريغ: " + err.message);
                }
            } finally {
                document.getElementById('loading').classList.add('hidden');
                const btn = document.getElementById('processBtn');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function downloadPDF() {
            const element = document.getElementById('outputContent');
            const opt = {
                margin:       10,
                filename:     'Lecture_Transcription.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }
    </script>
</body>
</html>
