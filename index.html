        async function fetchWithRetry(url, options, maxRetries = 3) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    const data = await response.json();

                    if (response.ok && !data.error) {
                        return data;
                    }

                    if (data.error && (data.error.code === 529 || data.error.code === 429 || (data.error.message && data.error.message.includes('demand')))) {
                        if (i < maxRetries - 1) {
                            document.getElementById('loadingText').innerText = `إعادة محاولة سريعة... (${i + 1}/${maxRetries})`;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            delay *= 1.2;
                            continue;
                        }
                    }
                    throw new Error(data.error ? data.error.message : "خطأ في الاتصال بالخدمة");
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        async function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const previewContainer = document.getElementById('imagePreviewContainer');
            const previewImg = document.getElementById('imagePreview');
            const statusText = document.getElementById('imageStatus');

            previewContainer.classList.remove('hidden');
            statusText.innerText = "جاري تحضير الصورة فندم...";

            try {
                compressedImageBase64 = await compressImage(file, 900, 900, 0.65);
                previewImg.src = "data:image/jpeg;base64," + compressedImageBase64;
                statusText.innerText = "جاهزة للتحليل الفوري ⚡";
            } catch (err) {
                alert("تعذر تحميل الصورة، يرجى اختيار صورة أخرى: " + err.message);
                statusText.innerText = "حدث خطأ أثناء تحميل الصورة";
            } finally {
                event.target.value = '';
            }
        }

        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const objectUrl = URL.createObjectURL(file);

                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    URL.revokeObjectURL(objectUrl);

                    const base64 = canvas.toDataURL('image/jpeg', quality).split(',')[1];
                    resolve(base64);
                };

                img.onerror = (err) => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error("لم نتمكن من قراءة ملف الصورة"));
                };

                img.src = objectUrl;
            });
        }
