<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق اختبارات الاختيار من متعدد</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 flex flex-col items-center font-sans">

  <div class="max-w-md w-full space-y-4">
    
    <header class="text-center py-2">
      <h1 class="text-xl font-extrabold text-indigo-400">📝 اختبارك الشخصي</h1>
      <p class="text-xs text-slate-400 mt-1">أنشئ أسئلتك واختبر نفسك الآن</p>
    </header>

    <!-- Tabs -->
    <div class="flex bg-slate-900 p-1 rounded-full border border-slate-700">
      <button id="tabManage" onclick="switchTab('manage')" class="flex-1 py-2 text-xs font-bold rounded-full bg-indigo-600 text-white transition">➕ إنشاء الأسئلة</button>
      <button id="tabQuiz" onclick="switchTab('quiz')" class="flex-1 py-2 text-xs font-bold rounded-full text-slate-400 hover:text-white transition">🚀 ابدأ الاختبار</button>
    </div>

    <!-- VIEW 1: MANAGE CARDS (MCQ Style) -->
    <div id="viewManage" class="space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3 shadow-lg">
        <h2 class="text-xs font-bold text-slate-300">إضافة سؤال اختبار جديد</h2>
        <div>
          <label class="block text-xs text-slate-400 mb-1">السؤال / المصطلح:</label>
          <input id="qInput" type="text" placeholder="مثال: ما عاصمة مصر؟" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>
        <div class="grid grid-cols-1 gap-2">
          <div>
            <label class="block text-xs text-emerald-400 mb-1 font-bold">الإجابة الصحيحة ✅:</label>
            <input id="aInput" type="text" placeholder="مثال: القاهرة" class="w-full bg-slate-950 border-2 border-emerald-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none">
          </div>
          <div class="space-y-1.5">
            <label class="block text-xs text-rose-400 mb-1">الإجابات الخاطئة ❌ (3 خيارات):</label>
            <input id="iInput1" type="text" placeholder="مثال: الرياض" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
            <input id="iInput2" type="text" placeholder="مثال: دبي" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
            <input id="iInput3" type="text" placeholder="مثال: الدوحة" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
          </div>
        </div>
        <button onclick="addCard()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition text-xs">+ حفظ سؤال الاختبار</button>
      </div>

      <div class="space-y-2">
        <div class="flex justify-between items-center px-1">
          <span class="text-xs text-slate-400">الأسئلة المحفوظة (<span id="cardCount">0</span>)</span>
          <button onclick="clearCards()" class="text-xs text-red-400 hover:underline">مسح الكل</button>
        </div>
        <div id="manageCardsList" class="space-y-2"></div>
      </div>
    </div>

    <!-- VIEW 2: QUIZ MODE (MCQ Style) -->
    <div id="viewQuiz" class="hidden space-y-4">
      
      <div id="quizContainer" class="space-y-4">
        <div class="flex justify-between items-center text-xs text-slate-400 px-1">
          <span id="quizProgress">السؤال 1 من 1</span>
          <span id="quizScore" class="text-emerald-400 font-bold">🎯 النتيجة: 0</span>
        </div>

        <!-- Question Display -->
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-5 shadow-2xl space-y-3">
          <span class="text-xs text-indigo-400 font-bold">❓ السؤال الحالي:</span>
          <p id="quizQ" class="text-base font-bold text-slate-100 py-1">...</p>
        </div>

        <!-- Options Display (MCQ) -->
        <div id="quizOptionsList" class="grid grid-cols-1 gap-2.5">
          <!-- Options dynamically inserted here -->
        </div>

        <!-- Status Message & Next Button -->
        <div id="quizStatus" class="hidden text-center p-3 rounded-lg border text-sm font-bold"></div>
        <button id="nextBtn" onclick="nextQuizCard()" class="hidden w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs transition">السؤال التالي ➡️</button>
      </div>

      <div id="quizEmpty" class="hidden bg-slate-900 p-8 rounded-2xl border border-slate-700 text-center space-y-3">
        <p class="text-3xl">🎉</p>
        <p class="text-xs font-bold text-slate-200" id="quizDoneTitle">أضف أسئلة أولاً لبدء الاختبار!</p>
        <button onclick="switchTab('manage')" class="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow">إنشاء أول سؤال</button>
      </div>

    </div>

  </div>

  <script>
    // Data Structure: { q, a (correct), incorrects ([i1, i2, i3]) }
    let cards = JSON.parse(localStorage.getItem('cards_mcq') || '[]');
    let currentQuizIndex = 0;
    let score = 0;
    let quizState = 'pending'; // 'pending', 'answered'

    function switchTab(tab) {
      document.getElementById('viewManage').classList.toggle('hidden', tab !== 'manage');
      document.getElementById('viewQuiz').classList.toggle('hidden', tab !== 'quiz');
      
      const tabM = document.getElementById('tabManage');
      const tabQ = document.getElementById('tabQuiz');

      if(tab === 'manage') {
        tabM.className = "flex-1 py-2 text-xs font-bold rounded-full bg-indigo-600 text-white transition";
        tabQ.className = "flex-1 py-2 text-xs font-bold rounded-full text-slate-400 hover:text-white transition";
        renderManageList();
      } else {
        tabQ.className = "flex-1 py-2 text-xs font-bold rounded-full bg-indigo-600 text-white transition";
        tabM.className = "flex-1 py-2 text-xs font-bold rounded-full text-slate-400 hover:text-white transition";
        startQuiz();
      }
    }

    function addCard() {
      const q = document.getElementById('qInput').value.trim();
      const a = document.getElementById('aInput').value.trim();
      const i1 = document.getElementById('iInput1').value.trim();
      const i2 = document.getElementById('iInput2').value.trim();
      const i3 = document.getElementById('iInput3').value.trim();

      if(!q || !a || !i1 || !i2 || !i3) return alert('يرجى ملء السؤال والإجابة الصحيحة وجميع الإجابات الخاطئة الثلاث!');
      
      cards.push({q, a, incorrects: [i1, i2, i3]});
      localStorage.setItem('cards_mcq', JSON.stringify(cards));
      
      // Clear inputs
      document.getElementById('qInput').value = '';
      document.getElementById('aInput').value = '';
      document.getElementById('iInput1').value = '';
      document.getElementById('iInput2').value = '';
      document.getElementById('iInput3').value = '';

      renderManageList();
      alert('تم حفظ سؤال الاختبار! اضغط على "ابدأ الاختبار" للتجربة.');
    }

    function deleteCard(idx) {
      cards.splice(idx, 1);
      localStorage.setItem('cards_mcq', JSON.stringify(cards));
      renderManageList();
    }

    function clearCards() {
      if(confirm('تأكيد مسح كافة الأسئلة المحفوظة؟')) {
        cards = [];
        localStorage.removeItem('cards_mcq');
        renderManageList();
      }
    }

    function renderManageList() {
      document.getElementById('cardCount').innerText = cards.length;
      const list = document.getElementById('manageCardsList');
      list.innerHTML = '';

      if(cards.length === 0) {
        list.innerHTML = `<p class="text-center text-xs text-slate-500 py-3">لا توجد أسئلة اختبار محفوظة.</p>`;
        return;
      }

      cards.forEach((c, i) => {
        list.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 flex justify-between items-center text-xs">
            <span class="font-bold text-indigo-300 truncate pl-2">❓ ${escapeHtml(c.q)}</span>
            <button onclick="deleteCard(${i})" class="text-slate-500 hover:text-rose-400 p-1">✕</button>
          </div>
        `;
      });
    }

    function startQuiz() {
      if(cards.length === 0) {
        document.getElementById('quizContainer').classList.add('hidden');
        document.getElementById('quizEmpty').classList.remove('hidden');
        document.getElementById('quizDoneTitle').innerText = "لا توجد أسئلة لمراجعتها! أنشئ أسئلة أولاً.";
        return;
      }

      document.getElementById('quizContainer').classList.remove('hidden');
      document.getElementById('quizEmpty').classList.add('hidden');
      currentQuizIndex = 0;
      score = 0;
      showQuizCard();
    }

    function showQuizCard() {
      const quizStatus = document.getElementById('quizStatus');
      const nextBtn = document.getElementById('nextBtn');
      quizStatus.classList.add('hidden');
      nextBtn.classList.add('hidden');
      quizState = 'pending';

      const card = cards[currentQuizIndex];
      document.getElementById('quizQ').innerText = card.q;
      document.getElementById('quizProgress').innerText = `السؤال ${currentQuizIndex + 1} من ${cards.length}`;
      document.getElementById('quizScore').innerText = `🎯 النتيجة: ${score}`;

      // Shuffle options: 1 Correct + 3 Incorrects
      let options = [card.a, ...card.incorrects];
      shuffleArray(options);

      const optionsList = document.getElementById('quizOptionsList');
      optionsList.innerHTML = '';

      options.forEach((opt, idx) => {
        optionsList.innerHTML += `
          <button onclick="answerQuizMcq(${escapeJsString(opt)}, this)" class="option-btn text-right bg-slate-900 border border-slate-700 hover:border-indigo-600 rounded-xl p-4 text-xs text-slate-200 transition">
            <span class="font-bold text-slate-500 ml-1.5">${String.fromCharCode(65 + idx)})</span> ${escapeHtml(opt)}
          </button>
        `;
      });
    }

    function answerQuizMcq(selectedAnswer, selectedBtn) {
      if(quizState === 'answered') return; // Prevent multiple clicks
      quizState = 'answered';

      const card = cards[currentQuizIndex];
      const quizStatus = document.getElementById('quiz Status');
      const nextBtn = document.getElementById('nextBtn');
      const optionBtns = document.getElementsByClassName('option-btn');

      // Feedback for all buttons
      for (let btn of optionBtns) {
        btn.onclick = null; // Disable all option clicks
        btn.classList.add('border-slate-800'); // De-emphasize border
        btn.classList.remove('hover:border-indigo-600');
        
        const btnText = btn.innerText.substring(btn.innerText.indexOf(')') + 2); // Get the option text, bypassing the 'A) ' part.
        
        if (btnText === card.a) {
          btn.classList.add('bg-emerald-950/70', 'border-emerald-600', 'text-emerald-300'); // Highlight correct answer
        }
      }

      if (selectedAnswer === card.a) {
        score++;
        quizStatus.innerText = "✅ إجابة صحيحة، أحسنت!";
        quizStatus.classList.add('bg-emerald-950/70', 'border-emerald-600', 'text-emerald-300');
        quizStatus.classList.remove('hidden', 'bg-rose-950/70', 'border-rose-600', 'text-rose-300');
      } else {
        selectedBtn.classList.add('bg-rose-950/70', 'border-rose-600', 'text-rose-300'); // Highlight chosen incorrect answer
        quizStatus.innerText = "❌ إجابة خاطئة! الإجابة الصحيحة هي: " + card.a;
        quizStatus.classList.add('bg-rose-950/70', 'border-rose-600', 'text-rose-300');
        quizStatus.classList.remove('hidden', 'bg-emerald-950/70', 'border-emerald-600', 'text-emerald-300');
      }

      document.getElementById('quizScore').innerText = `🎯 النتيجة: ${score}`;
      nextBtn.classList.remove('hidden');
    }

    function nextQuizCard() {
      currentQuizIndex++;

      if(currentQuizIndex < cards.length) {
        showQuizCard();
      } else {
        document.getElementById('quizContainer').classList.add('hidden');
        document.getElementById('quizEmpty').classList.remove('hidden');
        document.getElementById('quizDoneTitle').innerText = `انتهى الاختبار! نتيجة حفظك: ${score} من ${cards.length}`;
      }
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function escapeJsString(str) {
      return "'" + str.replace(/'/g, "\\'") + "'";
    }

    renderManageList();
  </script>
</body>
</html>
